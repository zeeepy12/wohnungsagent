name: Wohnungssuche
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python monitor.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          BEWERBER_PROFIL: ${{ secrets.BEWERBER_PROFIL }}
          IMAP_USER: ${{ secrets.SMTP_USER }}
          IMAP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      - name: Stand speichern
        run: |
          git config user.name "wohnungsagent"
          git config user.email "bot@users.noreply.github.com"
          git add state/seen.json
          git diff --staged --quiet || (git commit -m "state" && git push)
